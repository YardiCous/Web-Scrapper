x-collector: &collector
  build:
    context: .
    dockerfile: Dockerfile.collector
  environment: &database-environment
    PGHOST: db
    PGPORT: "5432"
    PGUSER: ${POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGDATABASE: ${POSTGRES_DB}
    PGCONNECT_TIMEOUT: "10"
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  collector-cartlane:
    <<: *collector
    environment:
      <<: *database-environment
      COLLECTOR_PLATFORM: cartlane
    ports:
      - "127.0.0.1:8101:8000"

  collector-tao:
    <<: *collector
    environment:
      <<: *database-environment
      COLLECTOR_PLATFORM: tao
    ports:
      - "127.0.0.1:8102:8000"

  collector-lazora:
    <<: *collector
    environment:
      <<: *database-environment
      COLLECTOR_PLATFORM: lazora
    ports:
      - "127.0.0.1:8103:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.collector
    entrypoint: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "180", "web.app:app"]
    environment:
      <<: *database-environment
      COLLECTOR_CARTLANE_URL: http://collector-cartlane:8000
      COLLECTOR_TAO_URL: http://collector-tao:8000
      COLLECTOR_LAZORA_URL: http://collector-lazora:8000
      SCORER_URL: http://scorer:8080
      PIPELINE_MODE: http
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      collector-cartlane:
        condition: service_healthy
      collector-tao:
        condition: service_healthy
      collector-lazora:
        condition: service_healthy
      scorer:
        condition: service_healthy
    restart: unless-stopped

  scorer:
    build:
      context: ./scorer
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "8080"
    ports:
      - "127.0.0.1:8200:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
