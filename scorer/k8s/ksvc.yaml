# DRAFT (not yet deployed): scorer as a Knative Service that scales to zero.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
    name: scorer
spec:
    template:
        metadata:
            annotations:
                autoscaling.knative.dev/min-scale: "0"
                autoscaling.knative.dev/max-scale: "10"
                autoscaling.knative.dev/target: "10"
        spec:
            containerConcurrency: 20
            containers:
              - image: scorer:v1 # kind load docker-image scorer:v1
                ports:
                  - containerPort: 8080
                env:
                  - name: DATABASE_URL
                    valueFrom:
                        secretKeyRef:
                            name: scorer-db
                            key: DATABASE_URL
                resources:
                    requests:
                        cpu: 500m
                        memory: 1Gi
                readinessProbe:
                    httpGet:
                        path: /healthz
