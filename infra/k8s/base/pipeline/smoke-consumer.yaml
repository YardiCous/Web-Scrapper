# listings.raw -> Postgres `listings` (idempotent upsert). Example KEDA target: copy this pair for
# collectors/normalisers (templates/kafka-worker*.yaml are the annotated versions).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-consumer
  namespace: pipeline
  labels:
    app.kubernetes.io/name: smoke-consumer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smoke-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-consumer
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: smoke-consumer
          image: cdc-tools
          args: ["consume"]
          envFrom:
            - configMapRef:
                name: cdc-env
            - secretRef:
                name: postgres-credentials
          env:
            - name: SERVICE_NAME
              value: smoke-consumer
            - name: KAFKA_GROUP_ID
              value: cdc.smoke-consumer
            - name: KAFKA_INPUT_TOPIC
              value: listings.raw
            - name: KAFKA_DLQ_TOPIC
              value: listings.dlq
            - name: WORK_MS_PER_MESSAGE
              value: "5"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/healthy) )) -lt 60"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: smoke-consumer
  namespace: pipeline
spec:
  scaleTargetRef:
    name: smoke-consumer
  minReplicaCount: 1
  maxReplicaCount: 6
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30   # Kubernetes default is 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: cdc-kafka-bootstrap.kafka.svc:9092
        consumerGroup: cdc.smoke-consumer
        topic: listings.raw
        lagThreshold: "100"
        offsetResetPolicy: earliest
