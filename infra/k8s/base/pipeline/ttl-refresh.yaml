apiVersion: v1
kind: ConfigMap
metadata:
  name: ttl-refresh
  namespace: pipeline
data:
  LISTING_TTL_MINUTES: "60"
  REFRESH_LIMIT: "1000"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ttl-refresh
  namespace: pipeline
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ttl-refresh
        spec:
          restartPolicy: Never
          containers:
            - name: ttl-refresh
              image: cdc-tools
              args: ["ttl-refresh"]
              envFrom:
                - configMapRef:
                    name: cdc-env
                - configMapRef:
                    name: ttl-refresh
                - secretRef:
                    name: postgres-credentials
              env:
                - name: SERVICE_NAME
                  value: ttl-refresh
                - name: KAFKA_OUTPUT_TOPIC
                  value: scrape.requests
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
