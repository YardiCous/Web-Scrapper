apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: collector-store-a
  namespace: pipeline
spec:
  scaleTargetRef:
    name: collector-store-a
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: cdc-kafka-bootstrap.kafka.svc:9092
        consumerGroup: cdc.collector.store_a
        topic: scrape.requests
        lagThreshold: "50"
        offsetResetPolicy: earliest
---
