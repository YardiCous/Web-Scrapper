# Template only (suspended, scheduled for 31 Feb). `make load` and the eval/ experiments create Jobs
# from it with their own --count/--rate/--run-id args.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loadgen
  namespace: pipeline
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loadgen
        spec:
          restartPolicy: Never
          containers:
            - name: loadgen
              image: cdc-tools
              args: ["loadgen", "--count", "1000", "--rate", "100", "--run-id", "manual"]
              envFrom:
                - configMapRef:
                    name: cdc-env
              env:
                - name: SERVICE_NAME
                  value: loadgen
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 256Mi
