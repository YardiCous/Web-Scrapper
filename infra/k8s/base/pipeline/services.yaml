# Slots for teammates' pipeline services. Parked at replicas: 0 so a placeholder never commits offsets
# in the real consumer group. To go live: set the image in k8s/base/kustomization.yaml, then raise
# replicas here or add a ScaledObject (templates/kafka-worker-scaledobject.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-store-a
  namespace: pipeline
  labels:
    app.kubernetes.io/name: collector-store-a
    cdc/owner: jj
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: collector-store-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector-store-a
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector-store-a
          image: collector-store-a
          envFrom:
            - configMapRef:
                name: cdc-env
            - secretRef:
                name: postgres-credentials
          env:
            - name: SERVICE_NAME
              value: collector-store-a
            - name: KAFKA_GROUP_ID
              value: cdc.collector.store_a
            - name: KAFKA_INPUT_TOPIC
              value: scrape.requests
            - name: KAFKA_OUTPUT_TOPIC
              value: listings.raw
            - name: KAFKA_DLQ_TOPIC
              value: listings.dlq
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
