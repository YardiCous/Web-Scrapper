# Pipeline services running the team's code through adapters/ (one image; SERVICE_NAME picks the role).
# One replica each; add a ScaledObject (templates/kafka-worker-scaledobject.yaml) to autoscale on lag.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-store-a
  namespace: pipeline
  labels:
    app.kubernetes.io/name: collector-store-a
    cdc/owner: jj
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collector-store-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector-store-a
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector-store-a
          image: collector-store-a
          envFrom:
            - configMapRef:
                name: cdc-env
            - secretRef:
                name: postgres-credentials
          env:
            - name: SERVICE_NAME
              value: collector-store-a
            - name: COLLECTOR_PLATFORM          # source_platform as web/scraper.py reports it
              value: Cartlane
            - name: FETCH_FROM                  # scrape the in-cluster copy of the store
              value: https://paegnium.github.io/dummysite/=http://store-a.web.svc/
            - name: KAFKA_GROUP_ID
              value: cdc.collector.store_a
            - name: KAFKA_INPUT_TOPIC
              value: scrape.requests
            - name: KAFKA_OUTPUT_TOPIC
              value: listings.raw
            - name: KAFKA_DLQ_TOPIC
              value: listings.dlq
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/healthy) )) -lt 60"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
