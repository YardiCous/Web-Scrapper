apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
configMapGenerator:
  - name: postgres-schema
    namespace: data
    files:
      - schema.sql
generatorOptions:
  # Schema edits are applied by `make up`; they shouldn't restart Postgres.
  disableNameSuffixHash: true
