apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - kafka
  - data
  - pipeline
  - scoring
  - web

# Every image our manifests use, by the short name on the left. GHCR_OWNER is replaced with the
# Makefile's GHCR_OWNER at deploy time.
images:
  # Built by scripts/images.sh. Store tags are the dummy-site commit served.
  - name: cdc-tools
    newName: ghcr.io/GHCR_OWNER/cdc-tools
    newTag: "0.1.0"
  - name: store-a
    newName: ghcr.io/GHCR_OWNER/store-a
    newTag: 2b8093c186c86c205feea65655569c472cfe33b7
  - name: store-b
    newName: ghcr.io/GHCR_OWNER/store-b
    newTag: 0526795c327979887e730aee6ba0d265aa922039
  - name: store-c
    newName: ghcr.io/GHCR_OWNER/store-c
    newTag: 24ee76c44f610ad486efcde2c49c406722e8d29f

  # Teammates' services, built from this repository by scripts/images.sh. The collectors, normaliser
  # and matcher share one image (adapters/): it runs the team's code and picks the role from SERVICE_NAME.
  - name: scorer              # Declan: scorer/
    newName: ghcr.io/GHCR_OWNER/scorer
    newTag: "0.1.0"
  - name: collector-store-a   # web/scraper.py via adapters/collector.py
    newName: ghcr.io/GHCR_OWNER/cdc-adapters
    newTag: "0.1.0"
  - name: collector-store-b
    newName: ghcr.io/GHCR_OWNER/cdc-adapters
    newTag: "0.1.0"
  - name: collector-store-c
    newName: ghcr.io/GHCR_OWNER/cdc-adapters
    newTag: "0.1.0"
  - name: normaliser          # Gordon: normaliser/core via adapters/normaliser.py
    newName: ghcr.io/GHCR_OWNER/cdc-adapters
    newTag: "0.1.0"
  - name: matcher             # Gordon: normaliser/core via adapters/matcher.py
    newName: ghcr.io/GHCR_OWNER/cdc-adapters
    newTag: "0.1.0"

  # Still on the placeholder.
  - name: gateway             # Yu Da
    newName: ghcr.io/GHCR_OWNER/cdc-placeholder
    newTag: "0.1.0"
  - name: frontend
    newName: ghcr.io/GHCR_OWNER/cdc-placeholder
    newTag: "0.1.0"
