# Dummy stores (static nginx) and the gateway/frontend slots (placeholders until Yu Da's images exist).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-a
  namespace: web
  labels:
    app.kubernetes.io/name: store-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: store-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-a
    spec:
      containers:
        - name: store-a
          image: store-a
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: store-a
  namespace: web
spec:
  selector:
    app.kubernetes.io/name: store-a
  ports:
    - name: http
      port: 80
      targetPort: http
