# Template: an HTTP service on Knative that scales to zero. Working example: k8s/base/scoring/scorer.yaml.
# The container must listen on $PORT (8080) and answer GET /healthz.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: my-service
  namespace: scoring
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "5"
        autoscaling.knative.dev/target: "10"     # concurrent requests per pod before scaling out
    spec:
      containerConcurrency: 0
      timeoutSeconds: 60
      containers:
        - image: my-service      # resolved by the images: list in k8s/base/kustomization.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cdc-env
            - secretRef:
                name: postgres-credentials
          env:
            - name: SERVICE_NAME
              value: my-service
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
